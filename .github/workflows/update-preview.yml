name: Update Social Preview

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw-runner --no-save playwright
          /tmp/pw-runner/node_modules/.bin/playwright install chromium

      - name: Generate preview screenshots
        env:
          NODE_PATH: /tmp/pw-runner/node_modules
          PREVIEW_TARGET_URL: http://127.0.0.1:8765
          PREVIEW_OUT_DIR: docs/preview
          PREVIEW_BADGE: "LIVE DEMO · CLOUD RUN"
          PREVIEW_TITLE: "MedioMeteo Genova"
          PREVIEW_DESC: "Nowcasting e forecasting dual-mode Terra/Mare su 67 comuni: 199 sensori reali OMIRL/ARPAL, fisica costiera e HUD."
          PREVIEW_TAGS: "Python,FastAPI,OMIRL / ARPAL,SQLite,PWA"
          PREVIEW_REPO: "github.com/Noobucodonosor/mediometeo"
          PREVIEW_LIVE_URL: "https://mediometeo-664856461640.europe-west1.run.app"
          PREVIEW_THEME: "dark"
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8765 >/tmp/mediometeo.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/v1/health >/dev/null && break
            sleep 0.5
          done
          node .github/scripts/generate-preview.mjs

      - name: Commit and push updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/preview/desktop.png docs/preview/mobile.png docs/preview/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview): auto-update social preview [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No preview changes detected."
          fi
